name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework django-cors-headers pillow pytesseract opencv-python flake8

      - name: Code Linting (Flake8)
        run: |
          # Kiểm tra lỗi syntax Python hoặc undefined variables
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Django System Checks & Tests
        run: |
          python manage.py check
          python manage.py test

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Check ESLint Rules
        run: npm run lint || true

      - name: Build React App
        run: npx vite build
